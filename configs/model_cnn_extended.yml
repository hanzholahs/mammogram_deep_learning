model_args:
  name: "cnn_extended"
  input_shape: [256, 256, 1]
  layers:
    # BACKBONE: CONV BLOCK 1
    - Conv2D:
        filters: 4
        kernel_size: [5, 5]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - Conv2D:
        filters: 8
        kernel_size: [3, 3]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - MaxPool2D:
        pool_size: [2, 2]
        strides: [2, 2]
    - BatchNormalization: {}
    - SpatialDropout2D:
        rate: 0.1

    # BACKBONE: CONV BLOCK 2
    - Conv2D:
        filters: 16
        kernel_size: [5, 5]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - Conv2D:
        filters: 32
        kernel_size: [3, 3]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - MaxPool2D:
        pool_size: [2, 2]
        strides: [2, 2]
    - BatchNormalization: {}
    - SpatialDropout2D:
        rate: 0.1

    # BACKBONE: CONV BLOCK 3
    - Conv2D:
        filters: 64
        kernel_size: [3, 3]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - MaxPool2D:
        pool_size: [2, 2]
        strides: [2, 2]
    - BatchNormalization: {}
    - SpatialDropout2D:
        rate: 0.1

    # BACKBONE: CONV BLOCK 4
    - Conv2D:
        filters: 128
        kernel_size: [3, 3]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - MaxPool2D:
        pool_size: [2, 2]
        strides: [2, 2]
    - BatchNormalization: {}
    - SpatialDropout2D:
        rate: 0.1

    # BACKBONE: CONV BLOCK 5
    - Conv2D:
        filters: 256
        kernel_size: [3, 3]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - MaxPool2D:
        pool_size: [2, 2]
        strides: [2, 2]
    - BatchNormalization: {}
    - SpatialDropout2D:
        rate: 0.1

    # BACKBONE: CONV BLOCK 6
    - Conv2D:
        filters: 512
        kernel_size: [3, 3]
        strides: [1, 1]
        padding: "valid"
        activation: "relu"
        kernel_regularizer:
          L2: 0.001
    - MaxPool2D:
        pool_size: [2, 2]
        strides: [2, 2]
    - BatchNormalization: {}
    - SpatialDropout2D:
        rate: 0.1

    # TRANSITION
    - GlobalAveragePooling2D: 
        name: "transition_layer"

    # HEAD: DENSE BLOCK 1
    - Dense:
        units: 1024
        activation: "relu"
        kernel_regularizer:
          L2: 0.01
    - BatchNormalization: {}
    - Dropout:
        rate: 0.4

    # HEAD: DENSE BLOCK 2
    - Dense:
        units: 128
        activation: "relu"
        kernel_regularizer:
          L2: 0.01
    - BatchNormalization: {}
    - Dropout:
        rate: 0.4

    # HEAD: OUTPUT LAYER
    - Dense:
        units: 1
        activation: "sigmoid"