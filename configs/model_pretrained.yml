epochs: 300
lr: 0.00001

model_checkpoint:
  save_best_only: True
  save_weights_only: True

early_stopping:
  patience: 30
  verbose: True

reduce_on_plateu:
  factor: 0.925
  patience: 5
  verbose: True

base_model_args:
  input_shape: [256, 256, 3]
  include_top: False
  weights: "imagenet"

model_args:
  name: "pretrained"
  input_shape: [256, 256, 3]
  layers:
    - GlobalAveragePooling2D:
        name: "transition_layer" 
    # HEAD: DENSE BLOCK 1
    - Dense:
        units: 512
        activation: "relu"
        kernel_regularizer:
          L2: 0.005
    - BatchNormalization: {}
    - Dropout:
        rate: 0.4
    # HEAD: DENSE BLOCK 2
    - Dense:
        units: 256
        activation: "relu"
        kernel_regularizer:
          L2: 0.005
    - BatchNormalization: {}
    - Dropout:
        rate: 0.4
    # HEAD: DENSE BLOCK 3
    - Dense:
        units: 128
        activation: "relu"
        kernel_regularizer:
          L2: 0.005
    - BatchNormalization: {}
    - Dropout:
        rate: 0.4
    # HEAD: OUTPUT LAYER
    - Dense:
        units: 1
        activation: "sigmoid"