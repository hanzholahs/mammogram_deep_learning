base_model_args:
  input_shape: [256, 256, 3]
  include_top: False
  weights: imagenet

model_args:
  name: ensemble_shared
  vote_method: "BinaryAverageVote"
  input_shape: [256, 256, 3]
  n_classifiers: 5
  transition:
    GlobalAveragePooling2D
  layers:
    - Dense:
        units: 64
        activation: relu
        kernel_regularizer:
          L2: 0.0001
    - BatchNormalization: {}
    - Dropout:
        rate: 0.25
    - Dense:
        units: 32
        activation: relu
        kernel_regularizer:
          L2: 0.0001
    - BatchNormalization: {}
    - Dropout:
        rate: 0.25
    - Dense:
        units: 1
        activation: sigmoid