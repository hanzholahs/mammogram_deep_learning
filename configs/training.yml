dataset:
  train:
    batch_size          : 64
    prefetch_buffer_size: 2
    shuffle_buffer_size : 5000
  test:
    batch_size          : 128
    prefetch_buffer_size: 2
    shuffle_buffer_size : 5000

low_memory_dataset:
  train:
    batch_size          : 16
    prefetch_buffer_size: 1
    shuffle_buffer_size : 5000
  test:
    batch_size          : 32
    prefetch_buffer_size: 1
    shuffle_buffer_size : 5000


initial_training:
  lr: 0.0001

  early_stopping:
    patience: 15
    verbose: True

  reduce_on_plateau:
    factor: 0.8
    patience: 3
    verbose: True


final_training:
  lr: 0.0001

  early_stopping:
    patience: 3
    verbose: True

  reduce_on_plateau:
    factor: 0.6
    patience: 2
    verbose: True